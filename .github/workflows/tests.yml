name: Tests
on: [push, pull_request]
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -v
  v2-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-v2.txt
      - run: ruff check --target-version py310 healthcare test_oidc.py test_v2_ingest.py test_v2_service.py test_journal_close.py test_registry.py test_point_in_time.py test_model_monitoring.py test_financial_questions.py test_local_model.py
      - run: python -m unittest discover -v
      - run: python -m healthcare.cli smoke --database out/v2.sqlite
      - run: python -m healthcare.cli train --database out/v2.sqlite --out out/ml-smoke.json
      - name: Verify local demo container
        run: |
          export CLAIMS_DEMO_SECRET="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          export CLAIMS_PREDICTIONS_HOST=./out/ci-predictions.csv
          python train_cost.py --database out/v2.sqlite --out out/ci-ridge.json
          python train_cost.py --database out/v2.sqlite --model out/ci-ridge.json --period 21 --out "$CLAIMS_PREDICTIONS_HOST"
          stack=(docker compose -f compose.yaml -f compose.predictions.yaml)
          trap '"${stack[@]}" down' EXIT
          "${stack[@]}" up --build -d
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/ready
          token="$(python -m healthcare.cli token --tenant 1)"
          curl --fail --header "Authorization: Bearer $token" http://127.0.0.1:8000/finance/1/pmpm/2025-12
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/finance/1/pmpm/2025-12)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $token" http://127.0.0.1:8000/finance/2/pmpm/2025-12)" = 403
          curl --fail --header "Authorization: Bearer $token" --header 'Content-Type: application/json' --data '{"question":"Explain restatement for 2025-12"}' http://127.0.0.1:8000/finance/questions
          member="$(awk -F, '$1==1 {print $2; exit}' "$CLAIMS_PREDICTIONS_HOST")"
          curl --fail --header "Authorization: Bearer $token" "http://127.0.0.1:8000/predictions/1/$member/21"
          "${stack[@]}" restart api
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 --header "Authorization: Bearer $token" "http://127.0.0.1:8000/predictions/1/$member/21"
  dbt:
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      CLAIMS_CLOSE_PARQUET: ${{ github.workspace }}/out/close_fact.parquet
      CLAIMS_ANALYTICS_DB: ${{ github.workspace }}/out/claims_analytics.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-analytics.txt
      - run: python build_platform.py --members 1000 --tenants 3 --database out/claims.sqlite
      - run: python export_closes.py --database out/claims.sqlite --out out/close_fact.parquet
      - run: dbt build --project-dir analytics --profiles-dir analytics
      - run: dbt build --project-dir analytics --profiles-dir analytics
  oidc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-v2.txt
      - run: python -m healthcare.local_oidc
      - name: Verify the TLS Keycloak stack
        run: |
          stack=(docker compose -f compose.oidc.yaml)
          trap '"${stack[@]}" down --volumes' EXIT
          "${stack[@]}" up --build -d
          curl --fail --retry 20 --retry-all-errors --retry-delay 3 --cacert out/local-oidc/ca.pem https://localhost:18443/realms/claims/.well-known/openid-configuration -o /dev/null
          python -m healthcare.verify_local_oidc
          "${stack[@]}" restart api
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:18764/ready
          python -m healthcare.verify_local_oidc --restart-check
