name: Tests
on: [push, pull_request]
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -v
  v2-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-v2.txt
      - run: ruff check healthcare test_v2_ingest.py test_v2_service.py test_journal_close.py test_registry.py test_point_in_time.py
      - run: python -m unittest discover -v
      - run: python -m healthcare.cli smoke --database out/v2.sqlite
      - run: python -m healthcare.cli train --database out/v2.sqlite --out out/ml-smoke.json
      - name: Verify local demo container
        run: |
          export CLAIMS_DEMO_SECRET="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          trap 'docker compose down' EXIT
          docker compose up --build -d
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/ready
          token="$(python -m healthcare.cli token --tenant 1)"
          curl --fail --header "Authorization: Bearer $token" http://127.0.0.1:8000/finance/1/pmpm/2025-12
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $token" http://127.0.0.1:8000/finance/2/pmpm/2025-12)" = 403
  dbt:
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
      CLAIMS_CLOSE_PARQUET: ${{ github.workspace }}/out/close_fact.parquet
      CLAIMS_ANALYTICS_DB: ${{ github.workspace }}/out/claims_analytics.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-analytics.txt
      - run: python build_platform.py --members 1000 --database out/claims.sqlite
      - run: python export_closes.py --database out/claims.sqlite --out out/close_fact.parquet
      - run: dbt build --project-dir analytics --profiles-dir analytics
      - run: dbt build --project-dir analytics --profiles-dir analytics
